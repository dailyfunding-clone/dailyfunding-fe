name: ci

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  fe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download BE OpenAPI schema
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.BE_ARTIFACT_TOKEN || secrets.GITHUB_TOKEN }}
          repo: dailyfunding-be
          workflow: ci.yml
          name: openapi-schema
          path: packages/api-client
      - name: Regenerate schema.d.ts
        run: |
          cd packages/api-client
          [ -f schema.yaml ] || mv schema.json schema.yaml
          pnpm typegen
      - name: Fail if generated types drifted
        run: git diff --exit-code packages/api-client/src/schema.d.ts
