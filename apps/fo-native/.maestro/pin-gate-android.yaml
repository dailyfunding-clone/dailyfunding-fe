appId: com.cyjoon.dailyfundingmobile
---
- launchApp
- runFlow:
    when:
      visible:
        text: Fetch development servers
    commands:
      - openLink: "dailyfunding://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
- runFlow:
    when:
      visible:
        text: Continue
    commands:
      - tapOn:
          text: Continue
- runFlow:
    when:
      visible:
        text: Open DevTools|Toggle performance monitor
    commands:
      - back
- extendedWaitUntil:
    visible:
      text: 간편비밀번호|마이
    timeout: 30000
- runFlow:
    file: subflows/pin-unlock-android.yaml
- extendedWaitUntil:
    visible:
      text: 마이
    timeout: 15000
- assertNotVisible:
    text: 간편비밀번호 입력
- assertNotVisible:
    text: 취소
