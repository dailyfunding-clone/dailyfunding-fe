appId: com.cyjoon.dailyfunding-mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    when:
      visible:
        text: Enter URL manually
    file: subflows/dev-server-load.yaml
- runFlow:
    when:
      visible:
        text: Toggle performance monitor
    commands:
      - tapOn:
          point: 89%,48%
- extendedWaitUntil:
    visible:
      text: 로그인|마이
    timeout: 30000
- runFlow:
    when:
      visible:
        text: 로그인
    file: subflows/webview-signin.yaml
- extendedWaitUntil:
    visible:
      text: 마이
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: 마이
    timeout: 30000
- assertNotVisible:
    text: 투자부터 상환까지, 매일 쌓이는 수익
