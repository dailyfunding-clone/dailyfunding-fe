appId: com.cyjoon.dailyfundingmobile
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Fetch development servers
    commands:
      - openLink: "dailyfunding://expo-development-client/?url=http%3A%2F%2F172.30.1.71%3A8081"
- runFlow:
    when:
      visible:
        text: Continue
    commands:
      - tapOn:
          text: Continue
- runFlow:
    when:
      visible:
        text: Open DevTools|Toggle performance monitor
    commands:
      - back
- extendedWaitUntil:
    visible:
      text: 가입하기
    timeout: 30000
- tapOn:
    text: 가입하기
    index: 0
- extendedWaitUntil:
    visible:
      text: 어떤 회원으로 가입할까요?
    timeout: 30000
- tapOn:
    text: 개인 이메일로 바로 가입해요
- extendedWaitUntil:
    visible:
      text: 계정 정보
    timeout: 30000
- assertNotVisible:
    text: 이미 계정이 있어요
- tapOn:
    text: "^이메일$"
- inputText: pinuser6@test.com
- hideKeyboard
- tapOn:
    text: "^비밀번호$"
- inputText: Test1234!
- hideKeyboard
- tapOn:
    text: 비밀번호 확인
- inputText: Test1234!
- hideKeyboard
- tapOn:
    text: 모두 동의해요
- tapOn:
    text: "^다음$"
- extendedWaitUntil:
    visible:
      text: 이름
    timeout: 15000
- tapOn:
    text: "^이름$"
- inputText: 육테스트
- hideKeyboard
- tapOn:
    text: 생년월일
- inputText: "19980303"
- hideKeyboard
- tapOn:
    text: 휴대폰 번호
- inputText: "01099990000"
- hideKeyboard
- tapOn:
    text: 인증하고 가입하기
- extendedWaitUntil:
    visible:
      text: 가입이 완료됐어요
    timeout: 30000
- tapOn:
    text: 로그인하기
- extendedWaitUntil:
    visible:
      text: 이메일
    timeout: 15000
- runFlow:
    file: subflows/webview-signin-android.yaml
- extendedWaitUntil:
    visible:
      text: 마이
    timeout: 30000
