      text: 계정 정보
    timeout: 30000
- assertNotVisible:
    text: 이미 계정이 있어요
- tapOn:
    text: "^이메일$"
- inputText: corp1@test.com
- hideKeyboard
- tapOn:
    text: "^비밀번호$"
- inputText: Test1234!
- hideKeyboard
- tapOn:
    text: 비밀번호 확인
- inputText: Test1234!
- hideKeyboard
- tapOn:
    text: 모두 동의해요
- tapOn:
